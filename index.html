<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crynova Mining</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Firebase SDK (مهم جداً!) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        body { font-family: Arial; padding: 20px; direction: rtl; }
        .card { background: #f5f5f5; padding: 20px; border-radius: 12px; margin-bottom: 16px; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 8px; }
        .btn-primary { background: #6c5ce7; color: white; }
        .btn-success { background: #00b894; color: white; }
        input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; margin-top: 8px; font-size: 16px; }
        .hidden { display: none; }
        #debug { background: #1a1a2e; color: #00ff00; padding: 12px; border-radius: 8px; font-size: 12px; font-family: monospace; white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto; margin-top: 16px; }
        .status { padding: 4px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; }
        .success { background: #00b89422; color: #00b894; }
        .error { background: #e1705522; color: #e17055; }
        .gradient { background: linear-gradient(135deg,#6c5ce7,#a29bfe); color: white; }
        .flex { display: flex; gap: 10px; }
        .flex-1 { flex: 1; }
        .text-center { text-align: center; }
    </style>
</head>
<body>

<div style="max-width:480px;margin:0 auto;">

    <!-- HEADER -->
    <div class="card gradient text-center">
        <h1>💎 Crynova Mining</h1>
        <div id="userInfo">👤 جاري التحميل...</div>
        <div id="referralCodeDisplay" style="font-size:12px;opacity:0.8;margin-top:4px;"></div>
    </div>

    <!-- الإحالات -->
    <div class="card">
        <h3>👥 الإحالات</h3>
        <div class="flex">
            <div class="flex-1" style="background:#e8e8e8;padding:12px;border-radius:8px;text-align:center;">
                <div style="font-size:24px;font-weight:bold;color:#6c5ce7;" id="refCount">0</div>
                <div style="font-size:12px;color:#666;">المدعوين</div>
            </div>
            <div class="flex-1" style="background:#e8e8e8;padding:12px;border-radius:8px;text-align:center;">
                <div style="font-size:24px;font-weight:bold;color:#00b894;" id="refEarnings">0.00</div>
                <div style="font-size:12px;color:#666;">العمولات</div>
            </div>
        </div>
    </div>

    <!-- رابط الدعوة -->
    <div class="card">
        <h3>🔗 رابط الدعوة</h3>
        <input type="text" id="referralLink" readonly value="جاري التحميل..." onclick="this.select();">
        <button class="btn btn-primary" onclick="copyLink()">📋 نسخ الرابط</button>
        <button class="btn btn-success" onclick="shareLink()">📤 مشاركة الرابط</button>
    </div>

    <!-- اختبار يدوي -->
    <div class="card">
        <h3>🧪 اختبار الإحالة</h3>
        <input type="text" id="testReferralCode" placeholder="أدخل كود الإحالة (رقم تيليجرام)">
        <button class="btn btn-primary" onclick="testReferral()">🔗 تسجيل الإحالة يدوياً</button>
    </div>

    <!-- Debug -->
    <div id="debug">⏳ جاري التهيئة...</div>

</div>

<script>
    // ============================================================
    // تهيئة Firebase (قبل أي شيء!)
    // ============================================================
    const firebaseConfig = {
        apiKey: "AIzaSyDCF0h_UPivX8oGoQL8Dn1s0lr79VAXpMY",
        authDomain: "crynova-4d6b3.firebaseapp.com",
        projectId: "crynova-4d6b3",
        storageBucket: "crynova-4d6b3.firebasestorage.app",
        messagingSenderId: "858898515024",
        appId: "1:858898515024:web:03827d57c2737bbc27bd55"
    };
    
    // تهيئة Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    
    console.log('✅ Firebase initialized');
    
    // ============================================================
    // الإعدادات
    // ============================================================
    const API_URL = 'https://crynova-1.onrender.com';
    const BOT_URL = 'https://t.me/Crynova_bot/Crynova';
    let tgUser = null;
    let userData = null;

    // ============================================================
    // عرض رسائل التصحيح
    // ============================================================
    function debug(msg) {
        const el = document.getElementById('debug');
        el.textContent += '\n' + msg;
        el.scrollTop = el.scrollHeight;
        console.log(msg);
    }

    // ============================================================
    // الحصول على مستخدم تيليجرام
    // ============================================================
    function getTelegramUser() {
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.expand();
            const user = tg.initDataUnsafe?.user;
            if (user) {
                return {
                    id: user.id,
                    username: user.username || '',
                    firstName: user.first_name || '',
                    lastName: user.last_name || ''
                };
            }
        }
        return null;
    }

    // ============================================================
    // التشغيل الرئيسي
    // ============================================================
    (async function init() {
        debug('🚀 بدء التشغيل...');
        
        tgUser = getTelegramUser();
        debug('👤 المستخدم: ' + JSON.stringify(tgUser));
        
        if (!tgUser) {
            document.getElementById('userInfo').textContent = '⚠️ يرجى فتح التطبيق من تيليجرام';
            debug('❌ لا يوجد مستخدم تيليجرام');
            return;
        }
        
        document.getElementById('userInfo').textContent = `👤 ${tgUser.firstName || 'مستخدم'} (${tgUser.id})`;
        
        // 1. تسجيل المستخدم
        await registerUser();
        
        // 2. معالجة الإحالة من الرابط
        await processReferralFromURL();
        
        // 3. جلب البيانات
        await loadUserData();
        
        // 4. تحديث الرابط
        updateReferralLink();
        
        debug('✅ تم التشغيل بنجاح!');
    })();

    // ============================================================
    // 1. تسجيل المستخدم
    // ============================================================
    async function registerUser() {
        try {
            debug('📤 تسجيل المستخدم...');
            const response = await fetch(`${API_URL}/api/user/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    telegramId: tgUser.id.toString(),
                    firstName: tgUser.firstName,
                    username: tgUser.username
                })
            });
            const data = await response.json();
            debug('✅ تسجيل المستخدم: ' + JSON.stringify(data));
            return data;
        } catch (error) {
            debug('❌ خطأ في التسجيل: ' + error.message);
        }
    }

    // ============================================================
    // 2. معالجة الإحالة من الرابط
    // ============================================================
    async function processReferralFromURL() {
        const urlParams = new URLSearchParams(window.location.search);
        const referralCode = urlParams.get('start');
        
        debug('🔍 كود الإحالة من الرابط: ' + (referralCode || 'لا يوجد'));
        
        if (!referralCode) {
            debug('ℹ️ لا يوجد كود إحالة');
            return;
        }
        
        if (referralCode === tgUser.id.toString()) {
            debug('⚠️ هذا هو كودك الخاص');
            return;
        }
        
        debug(`🔗 محاولة تسجيل الإحالة: ${tgUser.id} ← ${referralCode}`);
        
        try {
            const response = await fetch(`${API_URL}/api/referral`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    telegramId: tgUser.id.toString(),
                    referralCode: referralCode
                })
            });
            
            const data = await response.json();
            debug('📨 رد الخادم: ' + JSON.stringify(data));
            
            if (data.success) {
                debug('✅ تم تسجيل الإحالة بنجاح!');
                alert('🎉 تم تسجيل الإحالة بنجاح!');
                setTimeout(() => window.location.reload(), 1500);
            } else {
                debug('⚠️ فشل: ' + data.message);
                alert('⚠️ ' + data.message);
            }
        } catch (error) {
            debug('❌ خطأ في الاتصال: ' + error.message);
            alert('❌ خطأ في الاتصال بالخادم');
        }
    }

    // ============================================================
    // 3. جلب بيانات المستخدم (باستخدام Firebase)
    // ============================================================
    async function loadUserData() {
        try {
            debug('📥 جلب بيانات المستخدم...');
            const snapshot = await db.collection('users')
                .where('telegramId', '==', tgUser.id.toString())
                .get();
            
            if (!snapshot.empty) {
                const doc = snapshot.docs[0];
                userData = { uid: doc.id, ...doc.data() };
                debug('👤 بيانات المستخدم: ' + JSON.stringify(userData));
                updateUI();
            } else {
                debug('⚠️ المستخدم غير موجود في Firebase');
            }
        } catch (error) {
            debug('❌ خطأ في جلب البيانات: ' + error.message);
        }
    }

    // ============================================================
    // 4. تحديث الواجهة
    // ============================================================
    function updateUI() {
        if (!userData) return;
        const u = userData;
        document.getElementById('refCount').textContent = u.miningData?.totalReferrals || 0;
        document.getElementById('refEarnings').textContent = (u.wallets?.referral || 0).toFixed(2);
    }

    function updateReferralLink() {
        const link = `${BOT_URL}?start=${tgUser.id}`;
        document.getElementById('referralLink').value = link;
        document.getElementById('referralCodeDisplay').textContent = `🔗 كودك: ${tgUser.id}`;
    }

    // ============================================================
    // 5. اختبار يدوي
    // ============================================================
    async function testReferral() {
        const code = document.getElementById('testReferralCode').value.trim();
        if (!code) {
            alert('⚠️ يرجى إدخال كود الإحالة');
            return;
        }
        if (code === tgUser.id.toString()) {
            alert('⚠️ لا يمكنك استخدام كودك الخاص');
            return;
        }
        
        debug(`🧪 اختبار يدوي: ${tgUser.id} ← ${code}`);
        
        try {
            const response = await fetch(`${API_URL}/api/referral`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    telegramId: tgUser.id.toString(),
                    referralCode: code
                })
            });
            
            const data = await response.json();
            debug('📨 نتيجة الاختبار: ' + JSON.stringify(data));
            
            if (data.success) {
                alert('🎉 تم تسجيل الإحالة بنجاح!');
                location.reload();
            } else {
                alert('⚠️ ' + data.message);
            }
        } catch (error) {
            debug('❌ خطأ: ' + error.message);
            alert('❌ خطأ في الاتصال بالخادم');
        }
    }

    // ============================================================
    // 6. مساعدة
    // ============================================================
    function copyLink() {
        const link = document.getElementById('referralLink').value;
        if (navigator.clipboard) {
            navigator.clipboard.writeText(link);
            alert('📋 تم نسخ الرابط!');
        } else {
            alert('📋 ' + link);
        }
    }

    function shareLink() {
        const link = document.getElementById('referralLink').value;
        if (navigator.share) {
            navigator.share({ title: 'Crynova Mining', text: 'انضم إلينا!', url: link });
        } else {
            copyLink();
        }
    }

    console.log('✅ Crynova Mining جاهز!');
</script>

</body>
</html>
